services:
  postgres:
    image: postgres:15-alpine
    container_name: hotelos-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hotelos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-db:
    image: postgres:15-alpine
    container_name: hotelos-init-db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotelos-net
    volumes:
      - ./docker/init-db.sh:/init-db.sh
    entrypoint: ["sh", "/init-db.sh"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: hotelos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - hotelos-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  reception-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: reception-service
    container_name: hotelos-reception
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotelos_reception
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_PORT=8080
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    networks:
      - hotelos-net

  housekeeping-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: housekeeping-service
    container_name: hotelos-housekeeping
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotelos_housekeeping
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_PORT=8080
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    networks:
      - hotelos-net

  room-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: room-service
    container_name: hotelos-roomservice
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotelos_roomservice
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_PORT=8080
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    networks:
      - hotelos-net

  maintenance-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: maintenance-service
    container_name: hotelos-maintenance
    ports:
      - "8084:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotelos_maintenance
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_PORT=8080
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    networks:
      - hotelos-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: hotelos-nginx
    ports:
      - "80:80"
    depends_on:
      - reception-service
      - housekeeping-service
      - room-service
      - maintenance-service
    networks:
      - hotelos-net

volumes:
  postgres-data:

networks:
  hotelos-net:
    driver: bridge
