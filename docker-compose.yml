services:
  postgres:
    image: postgres:15-alpine
    container_name: hotelos-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    networks:
      - hotelos-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: hotelos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - hotelos-net

volumes:
  postgres-data:

networks:
  hotelos-net:
    driver: bridge
